# site.yml
- name: Base setup for all k3s VMs
  hosts: k3s
  become: true
  tasks:
    - name: Upgrade packages
      ansible.builtin.apt: { update_cache: true, upgrade: dist }
    - name: Install guest agent and Longhorn prerequisites
      ansible.builtin.apt:
        name: [qemu-guest-agent, open-iscsi, nfs-common]
        state: present
    - name: Start services
      ansible.builtin.systemd: { name: "{{ item }}", enabled: true, state: started }
      loop: [iscsid]

- name: k3s server
  hosts: k3s_server
  become: true
  tasks:
    - name: Install k3s server
      ansible.builtin.shell: >
        curl -sfL https://get.k3s.io | sh -s - server
        --disable servicelb --write-kubeconfig-mode 644 --tls-san 192.168.1.21
      args: { creates: /usr/local/bin/k3s }
    - name: Read join token
      ansible.builtin.slurp: { src: /var/lib/rancher/k3s/server/node-token }
      register: node_token
    - name: Copy kubeconfig to the ops VM
      ansible.builtin.fetch:
        src: /etc/rancher/k3s/k3s.yaml
        dest: "{{ lookup('env', 'HOME') }}/.kube/config"
        flat: true

- name: k3s workers
  hosts: k3s_workers
  become: true
  tasks:
    - name: Join the cluster
      ansible.builtin.shell: >
        curl -sfL https://get.k3s.io |
        K3S_URL=https://192.168.1.21:6443
        K3S_TOKEN={{ hostvars['k3s-server'].node_token.content | b64decode | trim }} sh -
      args: { creates: /usr/local/bin/k3s }

- name: Point kubectl at the cluster and label nodes
  hosts: localhost
  connection: local
  tasks:
    - name: Use the server IP in kubeconfig
      ansible.builtin.replace:
        path: "{{ lookup('env', 'HOME') }}/.kube/config"
        regexp: '127\.0\.0\.1'
        replace: 192.168.1.21
    - name: Label workers
      ansible.builtin.command: "kubectl label node {{ item.node }} lab/role={{ item.role }} --overwrite"
      loop:
        - { node: k3s-worker1, role: ai }
        - { node: k3s-worker2, role: db }
